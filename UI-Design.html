                </div>

              {/* Mobile Menu */}
              {isMobileMenuOpen && (
                <div className="md:hidden absolute top-full left-0 w-full bg-white border-b border-gray-100 shadow-xl py-6 flex flex-col items-center space-y-6 fade-in">
                  {["home", "menu", "contact"].map((id) => (
                    <button
                      key={id}
                      onClick={() => handlePageChange(id)}

                </div>
              </div>
              <div className="text-center border-t border-white/5 pt-10 text-gray-500 text-xs">
                © 2024 C&C Café & Cinema. All Rights Reserved.
              </div>
            </footer>
          </div>

      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
